name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs. CONTRIBUTING requires an upstream
      # skill to be pinned to an immutable ref, and a workflow
      # that runs on pull requests should hold itself to the same
      # rule it holds contributors to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate marketplace, plugins, and skills
        run: make validate

      - name: Confirm the generated catalogue is current
        run: make catalogue-check

      - name: Prove the guards fire
        run: make test

      - name: Verify the skills-only product contract
        run: make product-contract

      # The generator must not be what makes its own check pass.
      # catalogue-check used to regenerate before diffing, so a
      # stale committed catalogue was rewritten and then compared
      # against itself.
      - name: Confirm nothing above modified the working tree
        run: git diff --exit-code
