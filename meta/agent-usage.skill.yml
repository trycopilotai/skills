name: agent-usage
order: 4
displayName: agent-usage
status: published
category: observability
license: MIT
use: >-
  Read how much of each AI provider's usage limit is left,
  when it resets, and which provider still has headroom.
  Answers from measured readings and declines when it cannot:
  a provider that did not respond is reported as not
  responding, never as zero usage, and a forecast with too
  little history returns a reason instead of a number.
triggers:
  - agent-usage
  - usage
  - quota
  - rate limit
